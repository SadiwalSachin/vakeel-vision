services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
      
    restart: unless-stopped

    env_file:
      - ./server/.env.production

    environment:
      COOKIE_SECURE: "true"

    ports:
      - "127.0.0.1:8000:8000"

    networks:
      - vakeel-network


  client:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_BASE_URL: https://api-vakeel-vision.boardify.space

    restart: unless-stopped

    ports:
      - "127.0.0.1:3000:3000"

    networks:
      - vakeel-network

networks:
  vakeel-network:
    driver: bridge