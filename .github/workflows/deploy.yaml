
name: Deploy Vakeel Vision

on:
  push:
    branches:
      - feature/production-deployment

permissions:
  contents: read

concurrency:
  group: vakeel-vision-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            'set -eu
            cd /mnt/data/projects/vakeel-vision
            git fetch origin feature/production-deployment
            git checkout feature/production-deployment
            git reset --hard origin/feature/production-deployment
            sudo docker compose -f docker-compose.prod.yml up -d --build
            sudo docker compose -f docker-compose.prod.yml ps
            curl --fail --silent --show-error http://localhost:8000/health'
