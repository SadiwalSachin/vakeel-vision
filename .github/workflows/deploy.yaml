
name: Deploy Vakeel Vision

on:
  push:
    branches:
      - feature/production-deployment

permissions:
  contents: read

concurrency:
  group: vakeel-vision-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            'set -eu
            cd /mnt/data/projects/vakeel-vision

            echo "Fetching latest production branch..."
            git fetch origin feature/production-deployment
            git checkout feature/production-deployment
            git reset --hard origin/feature/production-deployment

            echo "Building and starting application..."
            sudo docker compose -f docker-compose.prod.yml up -d --build

            echo "Waiting for API health check..."

            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error http://localhost:8000/health; then
                echo
                echo "API health check passed."
                break
              fi

              if [ "$attempt" -eq 12 ]; then
                echo "ERROR: API failed to become healthy within 60 seconds."

                sudo docker compose -f docker-compose.prod.yml ps
                sudo docker compose -f docker-compose.prod.yml logs --tail=100 api

                exit 1
              fi

              echo "API not ready yet (attempt $attempt/12). Retrying in 5 seconds..."
              sleep 5
            done

            echo "Final container status:"
            sudo docker compose -f docker-compose.prod.yml ps

            echo "Deployment completed successfully."
            '
